# Packaging: `npm run dist` -> dist/Photo Vault Setup <version>.exe (installer) and a portable .exe
appId: app.photovault.desktop
productName: Photo Vault
copyright: Copyright © 2026 Photo Vault
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  # On-device AI: onnxruntime-web is bundled inside transformers.js already. Each platform below keeps only
  # its own onnxruntime-node binaries.
  - '!**/node_modules/onnxruntime-web/**'
# Native code (sharp/libvips) cannot be loaded from inside the asar archive.
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
  - '**/node_modules/onnxruntime-node/**/*'
  # Bundled ffmpeg (GPL, run as a separate program) for HEVC thumbnails and playable copies.
  - '**/node_modules/ffmpeg-static/**/*'
npmRebuild: false
# Auto-update: releases are published to the private repository; the app reads them with a token from Settings.
publish:
  provider: github
  owner: raullopesalves
  repo: photovault
  releaseType: release
win:
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Photo Vault
  # Uninstalling the app never touches photo libraries; only the app's own settings may be removed.
  deleteAppDataOnUninstall: false
  artifactName: PhotoVault-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
portable:
  artifactName: PhotoVault-${version}-Portable.${ext}
# Mac and Linux builds are produced by CI (.github/workflows/ci.yml); they are unsigned and less tested than Windows.
mac:
  target: dmg
  category: public.app-category.photography
  icon: build/icon.png
  identity: null
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'
linux:
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/{win32,darwin}/**'
  target: AppImage
  category: Graphics
  icon: build/icon.png
