# Checks every push: typecheck + the full test suite on Windows (the main platform), and unsigned
# Mac/Linux builds so those platforms keep compiling and packaging.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # onnxruntime-node's install script otherwise downloads optional GPU (CUDA) files on Linux, which
  # often times out; the CPU build the app uses is already in the package.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The end-to-end smoke test drives the built app through import, the viewer, albums, Tidy up, the Bin,
  # backups and more against a throwaway library. It went stale once when it only ran by hand.
  e2e:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- "${{ runner.temp }}/photovault-e2e-shots"
      # Keyboard, screen reader and colour contrast checks (axe-core on every page in both themes, plus the grid,
      # viewer, dialogs and menus by keyboard).
      - run: node scripts/a11y-audit.mjs
      - run: node scripts/a11y-audit.mjs --theme dark
      # Screenshots only when the test fails, and never failing the job: the account's artifact storage can be full.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/photovault-e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --dir
          - os: ubuntu-latest
            target: --linux --dir
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/electron-vite.mjs build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      # A full artifact storage quota must not fail an otherwise good build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: photo-vault-${{ matrix.os }}
          path: |
            dist/*-unpacked
            dist/mac*
          if-no-files-found: ignore
          retention-days: 7
